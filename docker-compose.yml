services:
  db:
    image: postgres:15
    container_name: self_rag_db
    environment:
      POSTGRES_USER: user_v2
      POSTGRES_PASSWORD: password_v2
      POSTGRES_DB: self_rag_v2
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_v2 -d self_rag_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: self_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data_v2:
  qdrant_data:
